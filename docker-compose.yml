# Local stack: Postgres + API + web, built from each app's Dockerfile.
#   make up            -> db, api (runs migrations first) and web
#   make ingest-docker -> one-off backfill from Elexon into the db
name: wind-forecast-portal

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/wind
  CORS_ORIGINS: '["http://localhost:5173"]'
  LOG_JSON: "true"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wind
    # 54320 on the host, so it never clashes with a Postgres already using 5432.
    ports: ["54320:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wind"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    ports: ["8000:8000"]

  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

  ingest:
    build: ./backend
    profiles: ["tools"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.ingestion backfill"]

volumes:
  db-data:
