server {
  listen 80;
  root /usr/share/nginx/html;

  # Same origin as the app, so no CORS; nginx's request id travels to the API's logs.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets never change, so browsers may keep them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/accuracy, /method) all load index.html.
  location / {
    try_files $uri /index.html;
  }
}
